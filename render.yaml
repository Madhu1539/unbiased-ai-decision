services:
  - type: web
    name: unbiased-ai-backend
    runtime: python
    # Root directory is the repo root so ml_pipeline/ and database/ are importable
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      # Set these manually in the Render dashboard → Environment tab
      # Never commit real values here
      - key: GEMINI_API_KEY
        sync: false          # Render will prompt you to fill this in the dashboard
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-frontend.onrender.com
    # NOTE: Free tier uses ephemeral storage.
    # Trained models (model.joblib, test_data.joblib) and the SQLite database
    # will be lost on every restart. Users will need to re-upload data and
    # retrain after a server restart. This is expected behaviour on free tier.
